scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

type Query {
    # @auth: ログイン中のユーザーを返す（未ログインなら null）
    me: User @auth

    # 自分の記録の一覧（開始日時の新しい順）
    sessions: [FocusSession!]! @guard
}

type Mutation {
    # @rules: 入力のチェック（メールは形式・255文字以内・重複なし、パスワードは8文字以上）
    register(
        email: String! @rules(apply: ["email", "max:255", "unique:users,email"])
        password: String! @rules(apply: ["min:8"])
    ): AuthPayload!

    login(email: String!, password: String!): AuthPayload!

    # @guard: ログイン中（有効なトークン付き）のときだけ実行できる
    logout: Boolean! @guard

    createSession(
        planned_minutes: Int! @rules(apply: ["min:1"])
        actual_minutes: Int! @rules(apply: ["min:0"])
        rating: Rating!
        started_at: DateTime!
        ended_at: DateTime! @rules(apply: ["after_or_equal:started_at"])
    ): FocusSession! @guard

    deleteSession(id: ID!): Boolean! @guard
}

enum Rating {
    MORE
    JUST
    HARD
}

type FocusSession {
    id: ID!
    planned_minutes: Int!
    actual_minutes: Int!
    rating: Rating!
    started_at: DateTime!
    ended_at: DateTime!
    break_skipped: Boolean!
    created_at: DateTime!
    updated_at: DateTime!
}

type AuthPayload {
    token: String!
}

# ここに書いた項目だけが外から取り出せる。password は書かないので公開されない
type User {
    id: ID!
    email: String!
    created_at: DateTime!
    updated_at: DateTime!
}
